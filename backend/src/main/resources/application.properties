spring.application.name=newsapp-backend
server.port=9000

# Base H2 en fichier (persiste entre redemarrages), console activee
spring.datasource.url=jdbc:h2:file:./data/newsapp;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=changeCetteCleSecreteEnProductionSVPMinimum256Bits!!
app.jwt.expiration-ms=86400000

# CXF SOAP
cxf.path=/services
